plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into the final mod jar.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.blamejared.com' } // JEI (dev runtime only)
    maven { // Sodium (dev runtime only, -Pdev_sodium=true)
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Dev-only: JEI at runtime so the hover key can be tested in JEI. Not a dependency of the mod.
    modLocalRuntime("mezz.jei:jei-1.21.1-fabric:$rootProject.jei_fabric_runtime_version") { transitive = false }


    // Opt-in compatibility check (rule 5): ./gradlew :fabric:runClient -Pdev_sodium=true
    if (rootProject.findProperty('dev_sodium') == 'true') {
        modLocalRuntime("maven.modrinth:sodium:$rootProject.sodium_fabric_version") { transitive = false }
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// Fixed dev player name: the offline UUID (and so the test world session) stays the same between runs.
loom {
    runs {
        client {
            programArgs "--username", "Dev"
        }
    }
}
