modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/Horizzon9/tryitout/issues"
license = "MPL-2.0"

[[mods]]
modId = "tryitout"
version = "${version}"
displayName = "TryItOut"
authors = "ufuk"
# Optional on both sides: the pocket scene is client-only; the test world needs it on the server too.
displayTest = "IGNORE_ALL_VERSION"
description = '''
A pocket test room: preview any block or item in an isolated live scene without leaving your world.
With the mod on the server too, a separate test world can be used.
'''

[[mixins]]
config = "tryitout.mixins.json"

[[mixins]]
config = "tryitout-neoforge.mixins.json"

[[dependencies.tryitout]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tryitout]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tryitout]]
modId = "architectury"
type = "required"
versionRange = "[13.0.0,)"
ordering = "AFTER"
side = "BOTH"
